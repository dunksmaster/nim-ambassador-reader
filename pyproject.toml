[project]
name = "ambassador-reader"
version = "0.1.0"
description = "Extract ambassador, campus, and developer-champion program facts from a page URL using NVIDIA NIM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ambassador-reader = "ambassador_reader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ambassador_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
